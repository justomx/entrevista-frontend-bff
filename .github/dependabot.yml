version: 2

registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.NPM_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries: [github-npm]
    schedule:
      interval: "weekly"
    

    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 🐳 Docker (importante para Trivy + ECR)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    